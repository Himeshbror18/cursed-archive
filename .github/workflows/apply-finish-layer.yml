name: Apply archive finishing layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach finishing assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="assets/archive-finish.css">'
          js = '<script src="assets/archive-finish.js"></script>'
          if css not in s:
              s = s.replace('</head>', '  ' + css + '\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', '  ' + js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit attachment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: attach archive finishing layer'
          git push
